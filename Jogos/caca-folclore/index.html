function carregar(){return Promise.all(Object.keys(D).map(n=>new Promise(r=>{const i=new Image();i.onload=()=>{IMG[n]=i;r()};i.onerror=r;i.src=n+'.png'})))}
function desenhaSprite(c,esp,anim,f,x,y,esq,alpha){const d=D[esp];if(!d||!IMG[esp])return;let a=d.anims[anim]||d.anims.parado;const q=a[f%a.length];
 c.save();if(alpha!=null)c.globalAlpha=alpha;c.translate(Math.round(x),Math.round(y));if(esq)c.scale(-1,1);
 c.drawImage(IMG[esp],(q%d.cols)*128,Math.floor(q/d.cols)*96,128,96,-64,-90,128,96);c.restore()}

let uid=1;
function criatura(esp,lvl,x,y){const s=ESP[esp];const hpM=Math.round(s.hp*(1+lvl*.12));return{id:uid++,esp,lvl,hp:hpM,hpM,x,y,px:x,py:y,dir:'baixo',esq:false,anim:'parado',a0:0,mov:false,alvo:null,cds:[0,0,0,0],golpes:golpesDe(esp),xp:0,home:{x,y},espera:0}}
function livre(x,y){return!bloqueia(tileEm(x,y))}
function livreSel(x,y){const t=tileEm(x,y);return!bloqueia(t)&&t!==7&&t!==10&&t!==13}
function mover(e,dx,dy){const L=(e!==M.j&&e!==M.parc&&!M.cena)?livreSel:livre;if(dx&&L(e.x+dx+Math.sign(dx)*10,e.y))e.x+=dx;if(dy&&L(e.x,e.y+dy+(dy>0?2:-8)))e.y+=dy}
function dirDe(e,dx,dy){if(Math.abs(dx)>Math.abs(dy)){e.dir='direita';e.esq=dx<0}else if(dy){e.dir=dy>0?'baixo':'cima';e.esq=false}}
const ESPH={curupira:'m',caipora:'m',onca:'m',lobisomem:'m',capivara:'a',tucano:'mcu',tamandua:'cu',lobo:'cu',boitata:'c'},DG={onca:28,lobisomem:44,boitata:24,lobo:12};
function nivel(d){return Math.max(1,Math.min(12,2+Math.floor(d/14)+(R()*2|0)))}
function habitat(tx,ty){const i=ty*MW+tx;return(URB[i]?'u':MATA[i]?'m':'c')+(AGUAP[i]?'a':'')}
function spawnSelvagem(){for(let k=0;k<90;k++){const a=R()*6.283,d=(9+R()*24)*T,x=M.j.x+Math.cos(a)*d,y=M.j.y+Math.sin(a)*d;if(x<8*T||y<8*T||x>(MW-8)*T||y>(MH-8)*T)continue;
 const t=tileEm(x,y);if(t!==0&&t!==1&&t!==5&&t!==2)continue;const h=habitat(x/T|0,y/T|0),dist=Math.hypot(x-CX*T,y-CY*T)/T;
 if(h[0]==='u'&&R()<.6)continue;
 const el=Object.keys(ESPH).filter(e=>ESPH[e].split('').some(c=>h.includes(c))&&dist>=(DG[e]||0)&&M.selv.filter(z=>z.esp===e).length<5);if(!el.length)continue;
 M.selv.push(criatura(el[R()*el.length|0],nivel(dist),x,y));return}}
function spawnSacis(){for(const r of REDE){if(r.sac&&M.selv.includes(r.sac))continue;r.sac=null;const d=Math.hypot(r.x-M.j.x,r.y-M.j.y)/T;if(d<9||d>40||R()<.5)continue;
 const c=criatura('saci',nivel(Math.hypot(r.x-CX*T,r.y-CY*T)/T),r.x,r.y-4);c.home={x:r.x,y:r.y};r.sac=c;M.selv.push(c)}}
function novoJogo(inicial){M.j={x:(CX+.5)*T,y:(CY+3.6)*T,px:(CX+.5)*T,py:(CY+3.6)*T,dir:'cima',esq:false,mov:false,anim:'parado',a0:0,esp:'treinador'};
 M.time=[criatura(inicial,5,M.j.x-30,M.j.y+20)];M.ativo=0;M.parc=M.time[0];
 for(let i=0;i<18;i++)spawnSelvagem();spawnSacis();
 const b=criatura('mula',10,(BX+.5)*T,(BY+1)*T);b.boss=true;M.selv.push(b);M.boss=b;salvar();montaHUD()}

const entrada={dx:0,dy:0};
function tick(){M.t++;const j=M.j;
 for(const e of[j,M.parc,...M.selv])if(e){e.px=e.x;e.py=e.y}
 // comandos
 while(M.cmd.length){const c=M.cmd.shift();if(c.t==='golpe')usarGolpe(c.i);else if(c.t==='cabaca')capturar();else if(c.t==='fugir')fimBatalha('fugiu');else if(c.t==='lutar')iniciarBatalha(c.alvo);else if(c.t==='trocar')trocar(c.i)}
 // jogador
 if(!M.bat){const v=Math.hypot(entrada.dx,entrada.dy);if(v>.15){const sp=18,dx=entrada.dx/Math.max(1,v)*sp,dy=entrada.dy/Math.max(1,v)*sp;mover(j,dx,dy);dirDe(j,dx,dy);j.mov=true}else j.mov=false}else j.mov=false;
 // portas

 if(M.pesca){if(M.bat||M.cena||Math.hypot(entrada.dx,entrada.dy)>.15){M.pesca=null;if(!M.bat&&!M.cena)aviso('Você parou de pescar')}else if(M.t>=M.pesca.fim)resolvePesca()}
 if(M.seguir&&!M.bat&&!M.cena){const e=M.seguir;if(!M.selv.includes(e)||e.corpo||Math.hypot(entrada.dx,entrada.dy)>.15){M.seguir=null}else{const d=Math.hypot(e.x-j.x,e.y-j.y);if(d<T*3){M.seguir=null;iniciarBatalha(e)}else{andarPara(j,e.x,e.y,18);j.mov=true}}}
 // parceiro segue
 const p=M.parc;if(p){if(M.bat){const e=M.bat.inimigo;const tx=e.x-(ESP[e.esp].boss?120:90),ty=e.y+4;andarPara(p,tx,ty,16);if(!p.mov){p.dir='direita';p.esq=false}}
  else{const d=Math.hypot(j.x-p.x,j.y-p.y);if(d>T*6){p.x=p.px=j.x-30;p.y=p.py=j.y+6}else if(d>60)andarPara(p,j.x-(j.esq?-36:36)*(j.dir==='direita'?1:0),j.y+(j.dir==='baixo'?-30:j.dir==='cima'?30:6),Math.min(26,d/4+8));else p.mov=false;
   if(p.hp<=0&&M.t%150===0){p.hp=Math.ceil(p.hpM*.3);aviso(ESP[p.esp].n+' se recuperou')}
   if(p.hp>0&&p.hp<p.hpM&&M.t%10===0)p.hp=Math.min(p.hpM,p.hp+1)}}
 // selvagens vagando
 if(!M.cena)for(const e of M.selv.slice()){if(e.corpo){if(!e.pegando&&M.t-e.t0>450)remover(e);continue}if(M.bat&&M.bat.inimigo===e){e.mov=false;e.dir='direita';e.esq=true;continue}
  if(HOSTIL.has(e.esp)&&!e.boss&&!M.bat&&!M.seguir&&M.t>60&&M.t>(M.graca||0)&&Math.hypot(j.x/T-CX,j.y/T-CY)>13){const dj=Math.hypot(e.x-j.x,e.y-j.y);if(dj<T*5){andarPara(e,j.x,j.y,9);e.mov=true;if(dj<T*1.7){aviso(ESP[e.esp].n+' te atacou!');iniciarBatalha(e)}continue}}
  if(e.espera>0){e.espera--;e.mov=false;continue}
  if(!e.alvo||Math.hypot(e.alvo.x-e.x,e.alvo.y-e.y)<8){if(R()<.5){e.espera=10+R()*30|0;e.alvo=null;continue}const r=e.boss?T*3:T*4;e.alvo={x:e.home.x+(R()*2-1)*r,y:e.home.y+(R()*2-1)*r}}
  const ox=e.x,oy=e.y,sp=e.boss?10:7;andarPara(e,e.alvo.x,e.alvo.y,sp);if(Math.hypot(e.x-ox,e.y-oy)<sp*.6){e.trava=(e.trava||0)+1;if(e.trava>=3){e.alvo=null;e.mov=false;e.trava=0;e.espera=20+R()*30|0}}else e.trava=0}

function andarPara(e,tx,ty,sp){const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d<4){e.mov=false;return}const s=Math.min(sp,d);const mx=dx/d*s,my=dy/d*s;mover(e,mx,my);dirDe(e,mx,my);e.mov=true}

function mult(gel,del){return FORTE[gel].includes(del)?1.6:FORTE[del]&&FORTE[del].includes(gel)&&gel!=='Normal'?.7:1}
function dano(at,df,g){const m=Math.max(mult(g.el,ESP[df.esp].el),mult(g.el,ESP[df.esp].el2)===1.6?1.3:1);const crit=R()<.06;const v=Math.max(1,Math.round(g.pot*(ESP[at.esp].atk/11)*(1+at.lvl*.1)*m*(.85+R()*.3)*(crit?1.5:1)));return{v,m,crit}}

function tickBatalha(){const b=M.bat,p=M.parc,e=b.inimigo;

  if(r.m>1)aviso('É super efetivo!');}
 if(e.hp<=0){const xp=e.lvl*12;let up=ganhaXp(p,xp);for(const c of M.time)if(c!==p&&c.hp>0)ganhaXp(c,Math.ceil(xp/2));
  const din=e.lvl*6+(R()*8|0);M.din+=din;M.vitorias++;if(e.boss){M.bauAberto=true;aviso('Você venceu a Mula sem Cabeça! Chegue perto do baú da Matriz e toque em Abrir.'+up)}else aviso('Vitória sobre '+ESP[e.esp].n+'! +'+xp+' XP, +R$ '+din+'.'+up);

  if(M.alvo===e)M.alvo=null;fimBatalha()}
 else if(p.hp<=0){aviso(ESP[p.esp].n+' desmaiou!');const outro=M.time.findIndex(c=>c.hp>0);if(outro>=0){trocar(outro,true)}else fimBatalha()}}

function capturar(){const b=M.bat;if(!b)return;const e=b.inimigo;if(e.boss){aviso('A Mula não pode ser capturada');return}

 const ch=Math.min(.95,(1-e.hp/e.hpM)*.85+.08);M.j.anim='ataque';M.j.a0=M.t;M.fx.push({t0:performance.now(),x0:M.j.x,y0:M.j.y-40,x1:e.x,y1:e.y-30,cor:'#e0a040',proj:1,cabaca:1});
 if(R()<ch){setTimeout(()=>aviso('Pegou! '+ESP[e.esp].n+' entrou pro time.'),450);e.hp=Math.max(1,Math.ceil(e.hpM*.5));e.cds=[0,0,0,0];e.anim='parado';remover(e);M.time.push(e);M.capturas++;fimBatalha();montaHUD()}
 else{setTimeout(()=>aviso('Escapou da cabaça! ('+Math.round(ch*100)+'%)'),450);b.cdI=Math.min(b.cdI,6)}}
function remover(e){const i=M.selv.indexOf(e);if(i>=0)M.selv.splice(i,1)}

function trocar(i,forcado){const c=M.time[i];if(!c||c===M.parc)return;if(c.hp<=0&&!forcado){aviso(ESP[c.esp].n+' está desmaiado');return}c.x=M.j.x+30;c.y=M.j.y+10;c.px=c.x;c.py=c.y;M.parc=c;M.ativo=i;if(M.bat)M.bat.cdI=Math.max(M.bat.cdI,10);montaAcoes();montaHUD()}

cv.addEventListener('pointerdown',ev=>{const wx=ev.clientX*DPR/Z+cam.x,wy=ev.clientY*DPR/Z+cam.y;
 if(M.cena){const n=M.cena.npc;if(n&&Math.abs(wx-n.x)<30&&wy<n.y+6&&wy>n.y-70){falar();return}}else{if(Math.abs(wx-BAU.x)<34&&wy<BAU.y+8&&wy>BAU.y-50&&!M.bat){abrirBau();return}}if(!M.cena)for(const q of TR.ped){if(Math.abs(wx-q.x)<26&&wy<q.y+6&&wy>q.y-64){const o=NPCS[q.k];aviso(o.n+': '+o.falas[(M.t+q.k)%o.falas.length]);return}}if(!M.cena)for(const e of M.selv){if(Math.abs(wx-e.x)<36&&wy<e.y+6&&wy>e.y-(e.boss?96:70)){if(e.corpo)lancarCabaca(e);else if(!M.bat)selecionar(e);return}}
 if(M.bat||jid!==null)return;jid=ev.pointerId;j0={x:ev.clientX,y:ev.clientY};joy.style.display='block';joy.style.left=(ev.clientX-60)+'px';joy.style.top=(ev.clientY-60)+'px';cv.setPointerCapture(ev.pointerId)});
cv.addEventListener('pointermove',ev=>{if(ev.pointerId!==jid)return;let dx=ev.clientX-j0.x,dy=ev.clientY-j0.y;const d=Math.hypot(dx,dy),mx=45;if(d>mx){dx*=mx/d;dy*=mx/d}ji.style.transform='translate('+dx+'px,'+dy+'px)';entrada.dx=dx/mx;entrada.dy=dy/mx});
const solta=ev=>{if(ev.pointerId!==jid)return;jid=null;joy.style.display='none';ji.style.transform='';entrada.dx=entrada.dy=0};
cv.addEventListener('pointerup',solta);cv.addEventListener('pointercancel',solta);
const teclas={};addEventListener('keydown',e=>{teclas[e.key.toLowerCase()]=1;tec();if(M.bat&&'1234'.includes(e.key))M.cmd.push({t:'golpe',i:+e.key-1});if(e.key===' '&&!M.bat){if(M.cena)falar();else{const p=perto(),cp=corpoPerto();if(p)selecionar(p);else if(cp)lancarCabaca(cp);else if(bauPerto())abrirBau();else if(aguaTile())pescar()}}if(e.key.toLowerCase()==='q'&&!M.bat){const cp=corpoPerto();if(cp)lancarCabaca(cp)}if(e.key.toLowerCase()==='p')usarItem('poc')});
addEventListener('keyup',e=>{teclas[e.key.toLowerCase()]=0;tec()});
function tec(){if(jid!==null)return;entrada.dx=(teclas.d||teclas.arrowright?1:0)-(teclas.a||teclas.arrowleft?1:0);entrada.dy=(teclas.s||teclas.arrowdown?1:0)-(teclas.w||teclas.arrowup?1:0)}
// início

 const pk=document.createElement('div');pk.className='pick';
 for(const esp of['curupira','capivara','saci']){const c=document.createElement('div');c.appendChild(retrato(esp,96,96));c.insertAdjacentHTML('beforeend','<b>'+ESP[esp].n+'</b><span>'+(ESP[esp].el==='Agua'?'Água':ESP[esp].el)+'</span>');c.onclick=()=>{d.remove();telaCheia();novoJogo(esp);montaAcoes();aviso('Boa! Explore a praça. Toque nas criaturas ou na lista de Batalha pra atacar.')};pk.appendChild(c)}
 d.appendChild(pk);document.body.appendChild(d)}
Promise.all([carregar(),carregarCenario(),carregarNpcs()]).then(()=>{tramaRuas();if(carregarSave()){montaAcoes();aviso('Jogo carregado')}else telaInicial();
 cam.x=(M.j?M.j.x:CX*T)-VW/2;cam.y=(M.j?M.j.y:CY*T)-VH/2;
 const wait=()=>{if(!M.j){requestAnimationFrame(wait);return}ultimo=performance.now();requestAnimationFrame(loop)};wait()});

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Sem conexão · Angatuba ON</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d; color: #f0f0f0;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem; font-weight: 800;
      letter-spacing: -0.03em; margin-bottom: 32px;
    }
    .logo span { color: #ff4444; }
    .icon {
      font-size: 4rem; margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem; font-weight: 800;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px; color: #7a7a7a;
      line-height: 1.6; max-width: 280px;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #ff4444; color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem; font-weight: 700;
      padding: 13px 28px; border-radius: 14px;
      border: none; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.96); opacity: 0.88; }
  </style>
</head>
<body>
  <div class="logo">Angatuba<span>ON</span></div>
  <div class="icon">📡</div>
  <h1>Você está sem conexão</h1>
  <p>Verifique seu Wi-Fi ou dados móveis e tente novamente.</p>
  <button class="btn" onclick="location.reload()">↺ Tentar novamente</button>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · AngatubaON</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    :root {
      --bg:      #0d0d0d;
      --surface: #181818;
      --s2:      #222;
      --border:  rgba(255,255,255,0.08);
      --text:    #f0f0f0;
      --muted:   #7a7a7a;
      --green:   #00d084;
      --red:     #ff4444;
      --zap:     #f59e0b;
      --blue:    #4285f4;
      --indigo:  #6366f1;
      --font-h:  'Syne', sans-serif;
      --font-b:  'DM Sans', sans-serif;
      --r:       14px;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-b); font-size: 14px;
      line-height: 1.5; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LOGIN ─────────────────────────────────────────── */
    #login-screen {
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 24px;
    }
    .login-box {
      width: 100%; max-width: 360px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px 24px; text-align: center;
    }
    .login-logo {
      font-family: var(--font-h); font-size: 1.6rem; font-weight: 800;
      margin-bottom: 4px;
    }
    .login-logo span { color: var(--red); }
    .login-sub { font-size: 12px; color: var(--muted); margin-bottom: 28px; }
    .login-field {
      width: 100%; background: var(--s2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; color: var(--text);
      font-family: var(--font-b); font-size: 15px; outline: none;
      margin-bottom: 12px; transition: border-color 0.2s;
    }
    .login-field:focus { border-color: rgba(255,255,255,0.25); }
    .login-btn {
      width: 100%; padding: 13px; border-radius: 12px;
      background: var(--red); color: #fff;
      font-family: var(--font-h); font-size: 1rem; font-weight: 700;
      transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.88; }
    .login-err {
      font-size: 12px; color: var(--red); margin-top: 10px;
      display: none;
    }

    /* ── PAINEL ─────────────────────────────────────────── */
    #admin-panel { display: none; }

    .admin-header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 20px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 100;
    }
    .admin-logo { font-family: var(--font-h); font-size: 1.1rem; font-weight: 800; }
    .admin-logo span { color: var(--red); }
    .admin-badge {
      font-size: 11px; background: var(--s2); border: 1px solid var(--border);
      color: var(--muted); padding: 4px 10px; border-radius: 20px;
    }
    .logout-btn {
      font-size: 12px; color: var(--muted); padding: 6px 12px;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--s2); transition: color 0.2s;
    }
    .logout-btn:hover { color: var(--red); }

    /* ── TABS ────────────────────────────────────────────── */
    .tabs {
      display: flex; border-bottom: 1px solid var(--border);
      padding: 0 20px; background: var(--surface);
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 12px 16px; font-size: 13px; font-weight: 600;
      color: var(--muted); border-bottom: 2px solid transparent;
      white-space: nowrap; transition: color 0.2s, border-color 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--red); }
    .tab-count {
      background: var(--red); color: #fff;
      font-size: 9px; font-weight: 800;
      padding: 2px 6px; border-radius: 10px; min-width: 18px;
      text-align: center; display: none;
    }
    .tab-count.visible { display: inline-block; }

    /* ── CONTEÚDO PRINCIPAL ─────────────────────────────── */
    .admin-body { padding: 20px; max-width: 720px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── CARDS DE CADASTRO ──────────────────────────────── */
    .store-cards { display: flex; flex-direction: column; gap: 12px; }

    .admin-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 16px; position: relative;
    }
    .admin-card.pendente { border-left: 3px solid var(--zap); }
    .admin-card.aprovado { border-left: 3px solid var(--green); }
    .admin-card.reprovado { border-left: 3px solid var(--red); opacity: 0.55; }

    .card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 10px; margin-bottom: 10px;
    }
    .card-name {
      font-family: var(--font-h); font-size: 0.95rem; font-weight: 700;
    }
    .card-ramo {
      font-size: 11px; color: var(--muted); margin-top: 2px;
    }
    .status-pill {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      padding: 3px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .pill-pendente { background: rgba(245,158,11,0.15); color: var(--zap); }
    .pill-aprovado { background: rgba(0,208,132,0.12); color: var(--green); }
    .pill-reprovado { background: rgba(255,68,68,0.12); color: var(--red); }

    .card-info { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .card-info-row {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--muted);
    }
    .card-info-row i { width: 14px; text-align: center; font-size: 11px; flex-shrink: 0; }
    .card-info-row a { color: var(--blue); }

    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .act-btn {
      padding: 7px 14px; border-radius: 8px; font-size: 12px;
      font-weight: 600; display: flex; align-items: center; gap: 5px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .act-btn:active { transform: scale(0.96); }
    .btn-approve { background: rgba(0,208,132,0.12); color: var(--green); border: 1px solid rgba(0,208,132,0.25); }
    .btn-reject  { background: rgba(255,68,68,0.1);  color: var(--red);   border: 1px solid rgba(255,68,68,0.2); }
    .btn-wpp     { background: rgba(37,211,102,0.12); color: #25d366;      border: 1px solid rgba(37,211,102,0.2); }
    .btn-plan    { background: rgba(99,102,241,0.12); color: var(--indigo);border: 1px solid rgba(99,102,241,0.25); }
    .btn-edit    { background: rgba(99,102,241,0.1); color: var(--indigo); border: 1px solid rgba(99,102,241,0.22); }

    /* ── FORMULÁRIO DE EDIÇÃO INLINE ─────────────────────── */
    .edit-form {
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .edit-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .edit-lbl {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 10px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em;
    }
    .edit-lbl.edit-full { grid-column: 1 / -1; }
    .edit-input {
      background: var(--s2); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 11px; color: var(--text);
      font-family: var(--font-b); font-size: 13px; outline: none;
      text-transform: none; letter-spacing: normal; font-weight: 400;
      transition: border-color .2s;
    }
    .edit-input:focus { border-color: rgba(255,255,255,0.25); }
    .edit-warn {
      display: flex; align-items: center; gap: 8px;
      margin-top: 10px; padding: 9px 12px;
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 8px; font-size: 11px; color: var(--zap); line-height: 1.4;
    }
    .edit-warn i { flex-shrink: 0; }
    .edit-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-save-edit {
      background: linear-gradient(135deg,#6366f1,#4f46e5);
      color: #fff; font-weight: 700;
    }
    .btn-cancel-edit {
      background: var(--s2); color: var(--muted);
      border: 1px solid var(--border);
    }
    @media (max-width: 480px) {
      .edit-grid { grid-template-columns: 1fr; }
      .edit-lbl.edit-full { grid-column: auto; }
    }

    /* ── PLAN MANAGER ────────────────────────────────────── */
    .plan-manager-row {
      display: flex; gap: 8px; align-items: center;
      flex-wrap: wrap; margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .plan-select, .plan-date-input {
      background: var(--s2); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px; color: var(--text);
      font-family: var(--font-b); font-size: 12px; outline: none;
    }
    .plan-select { cursor: pointer; }
    .plan-date-input { color-scheme: dark; }
    .btn-save-plan {
      background: linear-gradient(135deg,#f59e0b,#d97706);
      color: #000; font-weight: 700; font-size: 12px;
      padding: 7px 14px; border-radius: 8px; display: flex;
      align-items: center; gap: 5px;
    }

    /* ── EMPTY / LOADING ─────────────────────────────────── */
    .admin-empty {
      text-align: center; padding: 48px 20px;
      color: var(--muted); font-size: 13px;
    }
    .admin-empty i { font-size: 2rem; display: block; margin-bottom: 12px; opacity: 0.3; }

    .loading-row {
      display: flex; align-items: center; gap: 10px;
      padding: 20px; color: var(--muted); font-size: 13px;
      justify-content: center;
    }

    /* ── CATEGORIAS DE PLANO (sub-abas lado a lado) ────────── */
    .plan-cat-tabs {
      display: flex; gap: 8px; overflow-x: auto;
      margin-bottom: 16px; scrollbar-width: none;
    }
    .plan-cat-tabs::-webkit-scrollbar { display: none; }
    .plan-cat-btn {
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
      padding: 8px 14px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--border);
      font-family: var(--font-b); font-size: 12px; font-weight: 700;
      white-space: nowrap; transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .plan-cat-btn i { font-size: 11px; }
    .plan-cat-count {
      font-size: 10px; font-weight: 800; color: inherit;
      background: var(--s2); padding: 1px 7px; border-radius: 10px;
    }
    .plan-cat-btn.active { color: #000; }
    .plan-cat-btn.active .plan-cat-count { background: rgba(0,0,0,0.18); }

    /* ── SEARCH ──────────────────────────────────────────── */
    .admin-search-wrap { position: relative; margin-bottom: 16px; }
    .admin-search {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 14px 10px 38px; color: var(--text);
      font-family: var(--font-b); font-size: 14px; outline: none;
    }
    .admin-search:focus { border-color: rgba(255,255,255,0.2); }
    .admin-search-icon {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%); color: var(--muted); font-size: 12px;
      pointer-events: none;
    }

    /* ── TOAST ───────────────────────────────────────────── */
    #admin-toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid var(--green);
      border-radius: 12px; padding: 12px 18px;
      font-size: 13px; color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      opacity: 0; pointer-events: none; z-index: 9999;
      transition: opacity 0.25s, transform 0.25s;
      white-space: nowrap;
    }
    #admin-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #admin-toast.err  { border-left-color: var(--red); }
    /* ── COBRANÇAS ───────────────────────────────────────── */
    .cobr-summary {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
      margin-bottom: 16px;
    }
    .cobr-kpi {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 16px 14px; text-align: center;
    }
    .cobr-kpi.alert { border-color: rgba(255,68,68,0.3); background: rgba(255,68,68,0.05); }
    .cobr-kpi.warn  { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.05); }
    .cobr-kpi-val {
      font-family: var(--font-h); font-size: 1.7rem; font-weight: 800; line-height: 1;
    }
    .cobr-kpi.alert .cobr-kpi-val { color: var(--red); }
    .cobr-kpi.warn  .cobr-kpi-val { color: var(--zap); }
    .cobr-kpi-label { font-size: 10px; color: var(--muted); margin-top: 6px; text-transform: uppercase; letter-spacing: .04em; }
    .cobr-cat-tabs {
      display: flex; gap: 8px; overflow-x: auto;
      margin-bottom: 16px; scrollbar-width: none;
    }
    .cobr-cat-tabs::-webkit-scrollbar { display: none; }
    @media (max-width: 480px) {
      .cobr-summary { grid-template-columns: 1fr 1fr; }
      .cobr-summary .cobr-kpi:last-child { grid-column: 1 / -1; }
    }

    /* ── MÉTRICAS ────────────────────────────────────────────── */
    .metric-summary {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
      margin-bottom: 20px;
    }
    .metric-kpi {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px; text-align: center;
    }
    .metric-kpi-val {
      font-family: var(--font-h); font-size: 1.6rem; font-weight: 800;
      line-height: 1;
    }
    .metric-kpi-label { font-size: 10px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }

    .metric-table { display: flex; flex-direction: column; gap: 8px; }
    .metric-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .metric-rank {
      font-family: var(--font-h); font-size: 1rem; font-weight: 800;
      color: var(--muted); min-width: 24px; text-align: center;
    }
    .metric-rank.gold   { color: #f59e0b; }
    .metric-rank.silver { color: #94a3b8; }
    .metric-rank.bronze { color: #b45309; }
    .metric-info { flex: 1; min-width: 0; }
    .metric-nome { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric-plano { font-size: 10px; color: var(--muted); }
    .metric-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .metric-stat {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700; color: var(--muted);
      background: var(--s2); border: 1px solid var(--border);
      padding: 2px 7px; border-radius: 20px; white-space: nowrap;
    }
    .metric-stat i { font-size: 9px; }
    .metric-stat.up   { color: var(--green); background: rgba(0,208,132,0.1);  border-color: rgba(0,208,132,0.25); }
    .metric-stat.down { color: var(--red);   background: rgba(255,68,68,0.08);  border-color: rgba(255,68,68,0.22); }
    .metric-stat.flat { color: var(--muted); }
    .metric-bars { display: flex; flex-direction: column; gap: 4px; min-width: 100px; }
    .metric-bar-wrap { display: flex; align-items: center; gap: 6px; }
    .metric-bar-label { font-size: 10px; color: var(--muted); width: 24px; text-align: right; flex-shrink: 0; }
    .metric-bar-track { flex: 1; height: 6px; border-radius: 3px; background: var(--s2); overflow: hidden; }
    .metric-bar-fill  { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
    .metric-bar-fill.wpp { background: #25d366; }
    .metric-bar-fill.tel { background: var(--blue); }
    .metric-bar-fill.ig  { background: #e1306c; }

    /* Botão excluir loja */
    .btn-delete-loja {
      background: rgba(255,68,68,0.1); color: var(--red);
      border: 1px solid rgba(255,68,68,0.2);
      padding: 6px 10px; border-radius: 8px; font-size: 11px;
      font-weight: 700; display: flex; align-items: center; gap: 4px;
      cursor: pointer; transition: opacity .2s;
    }
    .btn-delete-loja:hover { opacity: .8; }

    /* Botões de validade rápida */
    .plan-quick-dates {
      display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px;
    }
    .plan-quick-btn {
      font-size: 10px; font-weight: 700; padding: 4px 9px;
      border-radius: 6px; border: 1px solid var(--border);
      background: var(--s2); color: var(--muted); cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .plan-quick-btn:hover { background: rgba(245,158,11,0.15); color: var(--zap); border-color: rgba(245,158,11,0.4); }
    .plan-quick-btn.active { background: rgba(245,158,11,0.2); color: var(--zap); border-color: rgba(245,158,11,0.5); }

    /* Botão reset métricas */
    .btn-reset-metricas {
      font-size: 11px; color: var(--red); padding: 6px 12px;
      border-radius: 8px; border: 1px solid rgba(255,68,68,0.25);
      background: rgba(255,68,68,0.08); display: flex; align-items: center; gap: 5px;
      cursor: pointer; transition: opacity .2s;
    }
    .btn-reset-metricas:hover { opacity: .8; }
    .metric-total { font-family: var(--font-h); font-size: 1rem; font-weight: 800; min-width: 28px; text-align: right; color: var(--text); }

    .metric-refresh {
      font-size: 11px; color: var(--muted); padding: 6px 12px;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--s2); display: flex; align-items: center; gap: 5px;
      cursor: pointer; transition: color .2s;
    }
    .metric-refresh:hover { color: var(--green); }
    .metric-period {
      font-size: 11px; color: var(--muted);
    }
  </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Angatuba<span>ON</span></div>
    <div class="login-sub">Painel Administrativo</div>
    <input class="login-field" id="login-pass" type="password"
      placeholder="Senha de acesso" autocomplete="current-password"
      onkeydown="if(event.key==='Enter') doLogin()" />
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="login-err">Senha incorreta.</div>
  </div>
</div>

<!-- ══ PAINEL ══ -->
<div id="admin-panel">

  <header class="admin-header">
    <div class="admin-logo">Angatuba<span>ON</span> <span style="font-size:11px;color:var(--muted);font-family:var(--font-b);font-weight:400;">· Admin</span></div>
    <button class="logout-btn" onclick="doLogout()"><i class="fa fa-right-from-bracket"></i> Sair</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pendentes', this)">
      <i class="fa fa-clock"></i> Pendentes
      <span class="tab-count" id="count-pendentes"></span>
    </button>
    <button class="tab-btn" onclick="switchTab('aprovados', this)">
      <i class="fa fa-check-circle"></i> Aprovados
      <span class="tab-count" id="count-aprovados"></span>
    </button>
    <button class="tab-btn" onclick="switchTab('planos', this)">
      <i class="fa fa-star"></i> Planos
    </button>
    <button class="tab-btn" onclick="switchTab('cobrancas', this)">
      <i class="fa fa-money-bill-wave"></i> Cobranças
      <span class="tab-count" id="count-cobrancas"></span>
    </button>
    <button class="tab-btn" onclick="switchTab('metricas', this)">
      <i class="fa fa-chart-bar"></i> Métricas
    </button>
  </div>

  <div class="admin-body">

    <!-- TAB: Pendentes -->
    <div class="tab-content active" id="tab-pendentes">
      <div class="admin-search-wrap">
        <i class="fa fa-search admin-search-icon"></i>
        <input class="admin-search" id="search-pendentes"
          placeholder="Filtrar pelo nome..." oninput="filterCards('pendentes')" />
      </div>
      <div class="plan-cat-tabs" id="pend-periodo-tabs"></div>
      <div class="store-cards" id="list-pendentes">
        <div class="loading-row"><i class="fa fa-spinner fa-spin"></i> Carregando...</div>
      </div>
    </div>

    <!-- TAB: Aprovados -->
    <div class="tab-content" id="tab-aprovados">
      <div class="admin-search-wrap">
        <i class="fa fa-search admin-search-icon"></i>
        <input class="admin-search" id="search-aprovados"
          placeholder="Filtrar pelo nome..." oninput="filterCards('aprovados')" />
      </div>
      <div class="store-cards" id="list-aprovados">
        <div class="loading-row"><i class="fa fa-spinner fa-spin"></i> Carregando...</div>
      </div>
    </div>

    <!-- TAB: Planos -->
    <div class="tab-content" id="tab-planos">
      <div class="admin-search-wrap">
        <i class="fa fa-search admin-search-icon"></i>
        <input class="admin-search" id="search-planos"
          placeholder="Filtrar pelo nome..." oninput="filterCards('planos')" />
      </div>
      <div class="plan-cat-tabs" id="plan-cat-tabs"></div>
      <div class="store-cards" id="list-planos">

    <div class="tab-content" id="tab-cobrancas">

      <div class="admin-search-wrap">
        <i class="fa fa-search admin-search-icon"></i>
        <input class="admin-search" id="search-cobrancas"
          placeholder="Filtrar pelo nome..." oninput="filterCards('cobrancas')" />
      </div>
      <div class="cobr-cat-tabs" id="cobr-cat-tabs"></div>
      <div class="store-cards" id="list-cobrancas">
        <div class="loading-row"><i class="fa fa-spinner fa-spin"></i> Carregando...</div>
      </div>

    <!-- TAB: Métricas -->
    <div class="tab-content" id="tab-metricas">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <span class="metric-period" id="metric-period">Carregando...</span>
        <div style="display:flex;gap:8px;">
          <button class="btn-reset-metricas" onclick="resetMetricas()">
            <i class="fa fa-trash"></i> Resetar
          </button>
          <button class="metric-refresh" onclick="loadMetricas()">
            <i class="fa fa-rotate-right"></i> Atualizar
          </button>

        <div class="metric-kpi"><div class="metric-kpi-val" id="kpi-total">—</div><div class="metric-kpi-label">Cliques Totais</div></div>
        <div class="metric-kpi"><div class="metric-kpi-val" id="kpi-views">—</div><div class="metric-kpi-label">Visualizações</div></div>
        <div class="metric-kpi"><div class="metric-kpi-val" id="kpi-conv">—</div><div class="metric-kpi-label">Conversão</div></div>
        <div class="metric-kpi"><div class="metric-kpi-val" style="color:#25d366;" id="kpi-wpp">—</div><div class="metric-kpi-label">WhatsApp</div></div>
        <div class="metric-kpi"><div class="metric-kpi-val" style="color:var(--blue);" id="kpi-tel">—</div><div class="metric-kpi-label">Telefone</div></div>
        <div class="metric-kpi"><div class="metric-kpi-val" style="color:#e1306c;" id="kpi-ig">—</div><div class="metric-kpi-label">Instagram</div></div>
      </div>
      <!-- Ranking de lojas -->
      <div class="metric-table" id="metric-table">
        <div class="loading-row"><i class="fa fa-spinner fa-spin"></i> Carregando métricas...</div>
      </div>
    </div>

  </div>
</div>

<!-- Toast -->
<div id="admin-toast"></div>

<script>
'use strict';

/* ══ CONFIG ══════════════════════════════════════════════════ */
// Sem senha aqui — autenticação é feita no servidor (Apps Script).
// O HTML só envia o SHA-256 da senha; o servidor valida e devolve um token.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwmJMmvb5H6KkMWdXJV441SQ2h18SEfLrb_4-kvUYM0IiVL6Co-EKGGay7f_qvUEi0_cg/exec';
const ADMIN_WPP       = '5515981125349';

// Token de sessão — salvo na memória da página (não no localStorage)
let _sessionToken = null;

/* ══ CRYPTO: SHA-256 via Web Crypto API ═══════════════════════ */
async function sha256(text) {
  const encoder = new TextEncoder();
  const data    = encoder.encode(text);
  const hashBuf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuf))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

/* ══ LOGIN ════════════════════════════════════════════════════ */
async function doLogin() {
  const passInput = document.getElementById('login-pass');
  const errEl     = document.getElementById('login-err');
  const loginBtn  = document.querySelector('.login-btn');
  const val = passInput.value.trim();
  if (!val) return;

  loginBtn.textContent = 'Verificando...';
  loginBtn.disabled    = true;
  errEl.style.display  = 'none';

  try {
    const passHash = await sha256(val);
    const params   = new URLSearchParams();
    params.append('payload', JSON.stringify({ action: 'login', passHash }));

    const resp = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body:   params,
      signal: AbortSignal.timeout(15000),
    });
    const json = await resp.json();

    if (json.status === 'ok' && json.data && json.data.token) {
      _sessionToken = json.data.token;
      sessionStorage.setItem('angatuba_token', _sessionToken);
      mostrarPainel();
    } else {
      errEl.textContent   = 'Senha incorreta.';
      errEl.style.display = 'block';
      passInput.value     = '';
    }
  } catch(e) {
    errEl.textContent   = 'Erro de conexão. Tente novamente.';
    errEl.style.display = 'block';
  } finally {
    loginBtn.textContent = 'Entrar';
    loginBtn.disabled    = false;
    passInput.focus();
  }
}

function mostrarPainel() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-panel').style.display  = 'block';
  loadData();
}

async function doLogout() {
  // Invalida o token no servidor (fire-and-forget)
  if (_sessionToken) {
    const params = new URLSearchParams();
    params.append('payload', JSON.stringify({ action: 'logout', token: _sessionToken }));
    fetch(APPS_SCRIPT_URL, { method: 'POST', body: params }).catch(() => {});
  }
  _sessionToken = null;
  sessionStorage.removeItem('angatuba_token');
  location.reload();
}

// Restaura sessão se token ainda existe na sessionStorage
const _storedToken = sessionStorage.getItem('angatuba_token');
if (_storedToken) {
  _sessionToken = _storedToken;
  // Mostra painel imediatamente; se o token expirou, loadData() vai detectar e forçar logout
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-panel').style.display  = 'block';
}

// Intercepta respostas UNAUTHORIZED e força logout automático
function handleUnauthorized() {
  toast('⚠️ Sessão expirada. Faça login novamente.', true);
  setTimeout(() => {
    _sessionToken = null;
    sessionStorage.removeItem('angatuba_token');
    location.reload();
  }, 2000);
}

/* ══ TABS ═════════════════════════════════════════════════════ */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'metricas') loadMetricas();
  if (name === 'cobrancas') renderCobrancas();
}

/* ══ DATA ═════════════════════════════════════════════════════ */
let allRows = [];

async function loadData() {
  try {
    const resp = await fetch(
      `${APPS_SCRIPT_URL}?action=admin&token=${encodeURIComponent(_sessionToken || '')}`,
      { signal: AbortSignal.timeout(12000) }
    );
    const json = await resp.json();
    if (json.status === 'erro' && json.msg === 'UNAUTHORIZED') {
      handleUnauthorized(); return;
    }
    if (json.status === 'ok' && Array.isArray(json.data)) {
      allRows = json.data;
      renderAll();
    } else {
      showFallbackError();
    }
  } catch(e) {
    showFallbackError();
  }
}

function showFallbackError() {
  ['pendentes','aprovados','planos','cobrancas'].forEach(k => {
    const el = document.getElementById('list-' + k);
    if (el) el.innerHTML =
      `<div class="admin-empty"><i class="fa fa-triangle-exclamation"></i>Erro ao carregar dados.<br>Verifique a URL do Apps Script.</div>`;
  });
  const mt = document.getElementById('metric-table');
  if (mt) mt.innerHTML =
    `<div class="admin-empty"><i class="fa fa-triangle-exclamation"></i>Erro ao carregar dados.</div>`;
}

function renderAll() {
  const pendentes = allRows.filter(r => r.status === 'PENDENTE');
  const aprovados = allRows.filter(r => r.status === 'APROVADO');

  setCount('pendentes', pendentes.length);
  setCount('aprovados', aprovados.length);

  renderPendentesPeriodo(pendentes);
  renderList('aprovados', [...aprovados].sort((a, b) => b.row - a.row));
  renderPlanos(aprovados);
}

/* ══ PENDENTES POR PERÍODO ════════════════════════════════════ */
/* A coluna A da planilha grava 'dd/mm/aaaa hh:mm:ss' no fuso de SP.
   Parseamos isso para classificar cada cadastro em hoje / ontem / semana. */
function parseDataCadastro(str) {
  if (!str) return null;
  const m = String(str).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ ,]+(\d{1,2}):(\d{2}))?/);
  if (!m) return null;
  let [, d, mo, y, hh, mm] = m;
  if (y.length === 2) y = '20' + y;
  d = +d; mo = +mo; y = +y;
  // Rejeita datas impossíveis (ex: 32/13/2026) que o Date "rolaria" silenciosamente
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, mo - 1, d, +(hh || 0), +(mm || 0));
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return dt;
}

/* Retorna 0 = hoje, 1 = ontem, 2..6 = esta semana, -1 = mais antigo/sem data */
function diasAtras(dt) {
  if (!dt) return -1;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dia  = new Date(dt); dia.setHours(0, 0, 0, 0);
  return Math.round((hoje - dia) / 86400000);
}

const PEND_PERIODOS = [
  { id: 'hoje',   titulo: 'Hoje',    icon: 'fa-bolt',          cor: 'var(--green)'  },
  { id: 'ontem',  titulo: 'Ontem',   icon: 'fa-clock-rotate-left', cor: 'var(--zap)' },
  { id: 'semana', titulo: 'Semana',  icon: 'fa-calendar-week',  cor: 'var(--indigo)' },
  { id: 'todos',  titulo: 'Todos',   icon: 'fa-layer-group',    cor: 'var(--muted)'  },
];
let pendPeriodoAtivo  = 'todos';
let pendPeriodoCache  = { hoje: [], ontem: [], semana: [], todos: [] };

function renderPendentesPeriodo(pendentes) {
  // Mais recentes primeiro (maior nº de linha = cadastro mais novo)
  const ordenados = [...pendentes].sort((a, b) => b.row - a.row);
  pendPeriodoCache = {
    todos:  ordenados,
    hoje:   ordenados.filter(r => diasAtras(parseDataCadastro(r.dataCadastro)) === 0),
    ontem:  ordenados.filter(r => diasAtras(parseDataCadastro(r.dataCadastro)) === 1),
    semana: ordenados.filter(r => { const n = diasAtras(parseDataCadastro(r.dataCadastro)); return n >= 0 && n <= 6; }),
  };
  renderPendPeriodoTabs();
  renderPendPeriodoLista();
}

function renderPendPeriodoTabs() {
  const el = document.getElementById('pend-periodo-tabs');
  if (!el) return;
  el.innerHTML = PEND_PERIODOS.map(c => {
    const n     = pendPeriodoCache[c.id].length;
    const ativo = c.id === pendPeriodoAtivo;
    const style = ativo
      ? `background:${c.cor};border-color:${c.cor};`
      : `color:${c.cor};border-color:${c.cor};`;
    return `
      <button class="plan-cat-btn${ativo ? ' active' : ''}" style="${style}"
        onclick="switchPendPeriodo('${c.id}')">
        <i class="fa ${c.icon}"></i> ${c.titulo}
        <span class="plan-cat-count">${n}</span>
      </button>`;
  }).join('');
}

function renderPendPeriodoLista() {
  const lista = pendPeriodoCache[pendPeriodoAtivo] || [];
  renderList('pendentes', lista);
  filterCards('pendentes'); // reaplica busca atual, se houver
}

function switchPendPeriodo(id) {
  pendPeriodoAtivo = id;
  renderPendPeriodoTabs();
  renderPendPeriodoLista();
}

function setCount(key, n) {
  const el = document.getElementById('count-' + key);
  if (!el) return;
  el.textContent = n;
  el.classList.toggle('visible', n > 0);
}

/* ══ RENDER LISTS ═════════════════════════════════════════════ */
function renderList(type, rows) {
  const el = document.getElementById('list-' + type);
  if (!rows.length) {
    el.innerHTML = `<div class="admin-empty"><i class="fa fa-inbox"></i>Nenhum cadastro aqui.</div>`;
    return;
  }
  el.innerHTML = rows.map(r => cardHTML(r, type)).join('');
}

/* Categorias da aba Planos — exibidas como sub-abas lado a lado.
   "Novas Lojas" = as 5 lojas mais recentes (maior número de linha), não
   exclusivas: uma loja PRO recém-cadastrada aparece tanto em "Novas Lojas"
   quanto em "Plano Pro", já que agora são vistas separadas (uma de cada vez),
   não seções empilhadas. */
const PLAN_CATS = [
  { id: 'novas',  titulo: 'Novas Lojas',  icon: 'fa-circle-plus', cor: 'var(--green)'  },
  { id: 'pro',    titulo: 'Plano Pro',    icon: 'fa-crown',       cor: 'var(--zap)'    },
  { id: 'plus',   titulo: 'Plano Plus',   icon: 'fa-bolt',        cor: 'var(--indigo)' },
  { id: 'gratis', titulo: 'Plano Grátis', icon: 'fa-gift',        cor: 'var(--muted)'  },
];
const NOVAS_QTD = 5;

let planCategoriaAtiva  = 'novas';
let planCategoriasCache = { novas: [], pro: [], plus: [], gratis: [] };

function renderPlanos(rows) {
  const tabsEl = document.getElementById('plan-cat-tabs');
  const listEl = document.getElementById('list-planos');

  if (!rows.length) {
    tabsEl.innerHTML = '';
    listEl.innerHTML = `<div class="admin-empty"><i class="fa fa-star"></i>Nenhuma loja aprovada ainda.</div>`;
    return;
  }

  const porRecencia = [...rows].sort((a, b) => b.row - a.row);

  planCategoriasCache = {
    novas:  porRecencia.slice(0, NOVAS_QTD),
    pro:    rows.filter(r => r.plano === 'PRO'),
    plus:   rows.filter(r => r.plano === 'PLUS'),
    gratis: rows.filter(r => r.plano !== 'PRO' && r.plano !== 'PLUS'),
  };

  // Se a categoria ativa ficou vazia (ex: era a única loja Pro e ela saiu
  // do plano), cai para a primeira categoria que ainda tem lojas.
  if (!planCategoriasCache[planCategoriaAtiva] || !planCategoriasCache[planCategoriaAtiva].length) {
    const fallback = PLAN_CATS.find(c => planCategoriasCache[c.id].length);
    planCategoriaAtiva = fallback ? fallback.id : 'novas';
  }

  renderPlanoTabs();
  renderPlanoLista();
}

function renderPlanoTabs() {
  const tabsEl = document.getElementById('plan-cat-tabs');
  tabsEl.innerHTML = PLAN_CATS.map(c => {
    const n     = planCategoriasCache[c.id].length;
    const ativo = c.id === planCategoriaAtiva;
    const style = ativo
      ? `background:${c.cor};border-color:${c.cor};`
      : `color:${c.cor};border-color:${c.cor};`;
    return `
      <button class="plan-cat-btn${ativo ? ' active' : ''}" style="${style}"
        onclick="switchPlanoCategoria('${c.id}')">
        <i class="fa ${c.icon}"></i> ${c.titulo}
        <span class="plan-cat-count">${n}</span>
      </button>`;
  }).join('');
}

function renderPlanoLista() {
  const listEl = document.getElementById('list-planos');
  const lista  = planCategoriasCache[planCategoriaAtiva] || [];
  listEl.innerHTML = lista.length
    ? lista.map(r => planCardHTML(r)).join('')
    : `<div class="admin-empty"><i class="fa fa-star"></i>Nenhuma loja nessa categoria.</div>`;
  filterCards('planos'); // reaplica o filtro de busca atual, se houver
}

function switchPlanoCategoria(id) {
  planCategoriaAtiva = id;
  renderPlanoTabs();
  renderPlanoLista();
}

/* ── Card de cadastro ─────────────────────────────────────── */
function cardHTML(r, type) {
  const statusCls = { PENDENTE:'pendente', APROVADO:'aprovado', REPROVADO:'reprovado' };
  const pillCls   = { PENDENTE:'pill-pendente', APROVADO:'pill-aprovado', REPROVADO:'pill-reprovado' };
  const cls  = statusCls[r.status] || 'pendente';
  const pill = pillCls[r.status]   || 'pill-pendente';

  const wppMsg = encodeURIComponent(`Olá ${r.nome}! Recebemos seu cadastro no AngatubaON. `);
  const wppLink = r.wpp ? `https://wa.me/${r.wpp.replace(/\D/g,'')}?text=${wppMsg}` : '';

  const isPendente = r.status === 'PENDENTE';

  return `
    <div class="admin-card ${cls}" id="card-${r.row}" data-nome="${escAttr(r.nome)}">
      <div class="card-top">
        <div>
          <div class="card-name">${escHtml(r.nome) || '—'}</div>
          <div class="card-ramo">${escHtml(r.ramo) || '—'} · linha ${r.row}</div>
        </div>
        <span class="status-pill ${pill}">${escHtml(r.status)}</span>
      </div>
      <div class="card-info">
        ${r.endereco ? `<div class="card-info-row"><i class="fa fa-map-marker-alt"></i>${escHtml(r.endereco)}</div>` : ''}
        ${r.wpp      ? `<div class="card-info-row"><i class="fab fa-whatsapp"></i>${escHtml(r.wpp)}</div>` : ''}
        ${r.tel      ? `<div class="card-info-row"><i class="fa fa-phone"></i>${escHtml(r.tel)}</div>` : ''}
        ${r.horario  ? `<div class="card-info-row"><i class="fa fa-clock"></i>${escHtml(r.horario)}</div>` : ''}
        ${r.planoSolicitado ? `<div class="card-info-row"><i class="fa fa-star"></i>Plano solicitado: <strong style="color:var(--zap);margin-left:4px;">${escHtml(r.planoSolicitado)}</strong></div>` : ''}
        ${r.obs      ? `<div class="card-info-row"><i class="fa fa-note-sticky"></i>${escHtml(r.obs)}</div>` : ''}
      </div>
      <div class="card-actions">
        ${isPendente ? `
          <button class="act-btn btn-approve" onclick="updateStatus(${r.row},'APROVADO',this)">
            <i class="fa fa-check"></i> Aprovar
          </button>
          <button class="act-btn btn-reject" onclick="updateStatus(${r.row},'REPROVADO',this)">
            <i class="fa fa-times"></i> Reprovar
          </button>` : ''}
        ${!isPendente ? `
          <button class="act-btn btn-edit" onclick="toggleEditLoja(${r.row})">
            <i class="fa fa-pen"></i> Editar
          </button>` : ''}
        ${wppLink ? `
          <a href="${wppLink}" target="_blank" class="act-btn btn-wpp">
            <i class="fab fa-whatsapp"></i> WhatsApp
          </a>` : ''}
      </div>
      ${!isPendente ? editFormHTML(r) : ''}
    </div>`;
}

/* ── Formulário de edição inline (Aprovados) ──────────────────── */
function editFormHTML(r) {
  return `
    <div class="edit-form" id="edit-${r.row}" style="display:none;">
      <div class="edit-grid">
        <label class="edit-lbl">Nome
          <input class="edit-input" id="ef-nome-${r.row}" value="${escAttr(r.nome)}" />
        </label>
        <label class="edit-lbl">Categoria / ramo
          <input class="edit-input" id="ef-ramo-${r.row}" value="${escAttr(r.ramo)}" />
        </label>
        <label class="edit-lbl edit-full">Endereço
          <input class="edit-input" id="ef-endereco-${r.row}" value="${escAttr(r.endereco)}" />
        </label>
        <label class="edit-lbl">WhatsApp
          <input class="edit-input" id="ef-wpp-${r.row}" value="${escAttr(r.wpp)}" inputmode="numeric" />
        </label>
        <label class="edit-lbl">Telefone
          <input class="edit-input" id="ef-tel-${r.row}" value="${escAttr(r.tel)}" inputmode="numeric" />
        </label>
        <label class="edit-lbl edit-full">Horário (texto)
          <input class="edit-input" id="ef-horario-${r.row}" value="${escAttr(r.horario)}" />
        </label>
        <label class="edit-lbl edit-full">Observações
          <input class="edit-input" id="ef-obs-${r.row}" value="${escAttr(r.obs)}" />
        </label>
      </div>
      <div class="edit-warn" id="edit-warn-${r.row}" style="display:none;">
        <i class="fa fa-triangle-exclamation"></i>
        Mudar o <strong>nome</strong> desvincula as métricas antigas desta loja (elas ficam registradas no nome anterior).
      </div>
      <div class="edit-actions">
        <button class="act-btn btn-save-edit" onclick="saveEditLoja(${r.row})">
          <i class="fa fa-save"></i> Salvar alterações
        </button>
        <button class="act-btn btn-cancel-edit" onclick="toggleEditLoja(${r.row})">
          Cancelar
        </button>
      </div>
    </div>`;
}

function toggleEditLoja(row) {
  const box = document.getElementById('edit-' + row);
  if (!box) return;
  const aberto = box.style.display !== 'none';
  box.style.display = aberto ? 'none' : 'block';
  if (!aberto) {
    // Liga aviso de métricas órfãs se o nome for alterado
    const nomeInput = document.getElementById('ef-nome-' + row);
    const r = allRows.find(x => x.row === row);
    const nomeOriginal = r ? (r.nome || '') : '';
    const warn = document.getElementById('edit-warn-' + row);
    nomeInput.oninput = () => {
      warn.style.display = (nomeInput.value.trim() !== nomeOriginal.trim()) ? 'flex' : 'none';
    };
  }
}

async function saveEditLoja(row) {
  const get = id => (document.getElementById(id + '-' + row).value || '').trim();
  const r = allRows.find(x => x.row === row);
  const wppAtual = r ? (r.wpp || '') : '';

  const dados = {
    nome:     get('ef-nome'),
    ramo:     get('ef-ramo'),
    endereco: get('ef-endereco'),
    wpp:      get('ef-wpp'),
    tel:      get('ef-tel'),
    horario:  get('ef-horario'),
    obs:      get('ef-obs'),
  };
  if (!dados.nome) { toast('⚠️ Nome não pode ficar vazio', true); return; }

  const btn = document.querySelector(`#edit-${row} .btn-save-edit`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Salvando...'; }

  try {
    await postAction({
      action:   'updateLoja',
      token:    _sessionToken,
      row:      row,
      wppAtual: wppAtual,
      ...dados,
    });

    // Atualiza estado local após confirmação do servidor
    if (r) {
      r.nome = dados.nome; r.ramo = dados.ramo; r.endereco = dados.endereco;
      let w = dados.wpp.replace(/\D/g, ''); if (w && !w.startsWith('55')) w = '55' + w;
      r.wpp = w; r.tel = dados.tel.replace(/\D/g, '');
      r.horario = dados.horario; r.obs = dados.obs;

/* ══ POST COM CONFIRMAÇÃO REAL ════════════════════════════════
   Substitui o antigo padrão no-cors (que "assumia sucesso" às cegas).
   Como o body é URLSearchParams (form-urlencoded = simple request),
   não há preflight CORS e conseguimos LER a resposta JSON do Apps Script
   — exatamente como o login já fazia. Lança erro se o servidor recusar. */
async function postAction(payloadObj, timeout = 15000) {
  const params = new URLSearchParams();
  params.append('payload', JSON.stringify(payloadObj));
  const resp = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body:   params,
    signal: AbortSignal.timeout(timeout),
  });
  const json = await resp.json();
  if (json.status === 'erro') {
    if (json.msg === 'UNAUTHORIZED') { handleUnauthorized(); throw new Error('Sessão expirada'); }
    throw new Error(json.msg || 'Falha no servidor');
  }
  return json.data || {};
}

/* ══ AÇÕES ════════════════════════════════════════════════════ */
async function updateStatus(row, newStatus, btn) {
  // Confirmação ao reprovar (evita reprovar por engano)
  if (newStatus === 'REPROVADO') {
    const r0 = allRows.find(x => x.row === row);
    const nome0 = r0 ? (r0.nome || 'esta loja') : 'esta loja';
    if (!confirm(`Reprovar "${nome0}"?\n\nEla deixará de aparecer no app.`)) return;
  }
  const labelOriginal = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
  try {
    await postAction({
      action: 'updateStatus',
      token:  _sessionToken,
      row:    row,
      status: newStatus,
    });
    toast('✅ Status atualizado para ' + newStatus);
    const r = allRows.find(x => x.row === row);
    if (r) r.status = newStatus;

    // Ao aprovar, abre o WhatsApp já com a mensagem de boas-vindas
    if (newStatus === 'APROVADO' && r && r.wpp) {
      abrirWppBoasVindas(r);
    }
    renderAll();
  } catch(e) {
    toast('❌ Erro ao atualizar: ' + e.message, true);
    btn.disabled = false;
    btn.innerHTML = labelOriginal;
  }
}

async function savePlan(row) {
  const plano      = document.getElementById('ps-' + row).value;
  const isoVal     = document.getElementById('pd-' + row).value;
  const validadeBR = isoVal ? isoVal.split('-').reverse().join('/') : '';

  const saveBtn = document.querySelector(`#plan-card-${row} .btn-save-plan`);
  if (saveBtn) { saveBtn.disabled = true; saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Salvando...'; }

  try {
    await postAction({
      action:    'updatePlan',
      token:     _sessionToken,
      row:       row,
      plano:     plano,
      planoValidade: validadeBR,
      planoPago: plano !== 'GRATIS' ? 'SIM' : 'NAO',
    });

    // Atualiza estado local após confirmação do servidor
    const r = allRows.find(x => x.row === row);
    if (r) {
      r.plano         = plano;
      r.planoValidade = validadeBR;
      r.recomendado   = (plano === 'PRO' || plano === 'PLUS') ? 'SIM' : 'NAO';
    }

    toast(`✅ Plano ${plano} salvo${validadeBR ? ' até ' + validadeBR : ' (vitalício)'}`);
    renderAll();

  } catch(e) {
    toast('❌ Erro ao salvar plano: ' + e.message, true);
  } finally {
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i class="fa fa-save"></i> Salvar'; }
  }
}

/* ══ VALIDADE RÁPIDA ══════════════════════════════════════════ */
function setQuickDate(row, dias, btn) {
  // Marca o botão ativo
  document.querySelectorAll(`#pq-${row} .plan-quick-btn`).forEach(b => b.classList.remove('active'));

    d.setDate(d.getDate() + dias);
    hiddenInput.value = d.toISOString().split('T')[0]; // yyyy-mm-dd

}

/* ══ FILTRO ═══════════════════════════════════════════════════ */
function filterCards(type) {
  const input = document.getElementById('search-' + type);
  if (!input) return;
  const q     = input.value.toLowerCase().trim();
  const listEl = document.getElementById('list-' + type);
  if (!listEl) return;
  const cards = listEl.querySelectorAll('.admin-card');
  let visiveis = 0;
  cards.forEach(c => {
    const bate = (c.dataset.nome || '').toLowerCase().includes(q);
    c.style.display = bate ? '' : 'none';
    if (bate) visiveis++;
  });
  // Feedback "nada encontrado" — só quando há busca ativa e nenhum card bate
  let semRes = listEl.querySelector('.search-empty');
  if (q && cards.length && visiveis === 0) {
    if (!semRes) {
      semRes = document.createElement('div');
      semRes.className = 'admin-empty search-empty';
      semRes.innerHTML = '<i class="fa fa-magnifying-glass"></i>Nenhuma loja encontrada para essa busca.';
      listEl.appendChild(semRes);
    }
  } else if (semRes) {
    semRes.remove();
  }
}

/* ══ HELPERS ══════════════════════════════════════════════════ */
function escAttr(s) {
  return String(s || '').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* Escapa conteúdo de texto visível (anti-XSS). Os dados vêm do cadastro
   público, então nome/ramo/endereço/obs podem conter HTML malicioso. */
function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function isoDate(br) {
  if (!br) return '';
  const p = br.split('/');
  if (p.length !== 3) return '';
  return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
}

let toastTimer;
function toast(msg, isErr = false) {
  const el = document.getElementById('admin-toast');
  el.textContent = msg;
  el.className   = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 3500);
}

/* Badge de crescimento semanal: compara cliques dos últimos 7 dias (d7)
   com os 7 dias anteriores (d7ant). Verde ▲ se subiu, vermelho ▼ se caiu. */
function crescimentoBadge(r) {
  const atual = r.d7 || 0;
  const ant   = r.d7ant || 0;
  if (atual === 0 && ant === 0) return '';
  if (ant === 0) {
    // Sem base na semana anterior — mostra só que houve atividade nova
    return `<span class="metric-stat up"><i class="fa fa-arrow-trend-up"></i> novo</span>`;
  }
  const pct = Math.round(((atual - ant) / ant) * 100);
  if (pct === 0) return `<span class="metric-stat flat">≈ 0%</span>`;
  const up = pct > 0;
  return `<span class="metric-stat ${up ? 'up' : 'down'}">
    <i class="fa fa-arrow-trend-${up ? 'up' : 'down'}"></i> ${up ? '+' : ''}${pct}%
  </span>`;
}

/* ══ COBRANÇAS / VENCIMENTOS ══════════════════════════════════
   Lê planoValidade (dd/mm/aaaa) das lojas PRO/PLUS e classifica por
   urgência. Vitalício (validade vazia) é ignorado — não vence.
   Grátis também fica fora: não há o que cobrar. */
const COBR_CATS = [
  { id: 'vencidas', titulo: 'Vencidas',    icon: 'fa-circle-exclamation', cor: 'var(--red)'    },
  { id: 'd7',       titulo: 'Vence em 7d', icon: 'fa-hourglass-half',      cor: 'var(--zap)'    },
  { id: 'd30',      titulo: 'Vence em 30d',icon: 'fa-calendar-day',        cor: 'var(--indigo)' },
  { id: 'emdia',    titulo: 'Em dia',      icon: 'fa-circle-check',        cor: 'var(--green)'  },
];
let cobrCatAtiva  = 'vencidas';
let cobrCache     = { vencidas: [], d7: [], d30: [], emdia: [] };

/* dias até vencer: negativo = já venceu, null = vitalício/sem data */
function diasAteVencer(validadeBR) {
  if (!validadeBR) return null;
  const m = String(validadeBR).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (!m) return null;
  let [, d, mo, y] = m;
  if (y.length === 2) y = '20' + y;
  d = +d; mo = +mo; y = +y;
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const venc = new Date(y, mo - 1, d); venc.setHours(0,0,0,0);
  if (venc.getFullYear() !== y || venc.getMonth() !== mo - 1 || venc.getDate() !== d) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  return Math.round((venc - hoje) / 86400000);
}

function renderCobrancas() {
  // Só lojas aprovadas e pagas (PRO/PLUS)
  const pagas = allRows.filter(r =>
    r.status === 'APROVADO' &&
    (String(r.plano).toUpperCase() === 'PRO' || String(r.plano).toUpperCase() === 'PLUS')
  );

  cobrCache = { vencidas: [], d7: [], d30: [], emdia: [] };
  pagas.forEach(r => {
    const dias = diasAteVencer(r.planoValidade);
    if (dias === null) return; // vitalício — não entra em cobrança
    const item = { ...r, _dias: dias };
    if (dias < 0)        cobrCache.vencidas.push(item);
    else if (dias <= 7)  cobrCache.d7.push(item);
    else if (dias <= 30) cobrCache.d30.push(item);
    else                 cobrCache.emdia.push(item);
  });
  // Ordena cada grupo pelo mais urgente primeiro
  Object.keys(cobrCache).forEach(k =>
    cobrCache[k].sort((a, b) => a._dias - b._dias)
  );

  // Badge na aba = vencidas + vence em 7d (o que precisa de ação agora)
  const urgentes = cobrCache.vencidas.length + cobrCache.d7.length;
  setCount('cobrancas', urgentes);

  // Se a categoria ativa está vazia, cai pra primeira com itens
  if (!cobrCache[cobrCatAtiva].length) {
    const fb = COBR_CATS.find(c => cobrCache[c.id].length);
    cobrCatAtiva = fb ? fb.id : 'vencidas';
  }

  renderCobrSummary();
  renderCobrTabs();
  renderCobrLista();
}

function renderCobrSummary() {
  const el = document.getElementById('cobr-summary');
  const totalReceita = cobrCache.vencidas.length + cobrCache.d7.length;
  el.innerHTML = `
    <div class="cobr-kpi alert">
      <div class="cobr-kpi-val">${cobrCache.vencidas.length}</div>
      <div class="cobr-kpi-label">Vencidas</div>
    </div>
    <div class="cobr-kpi warn">
      <div class="cobr-kpi-val">${cobrCache.d7.length}</div>
      <div class="cobr-kpi-label">Vencem em 7 dias</div>
    </div>
    <div class="cobr-kpi">
      <div class="cobr-kpi-val">${totalReceita}</div>
      <div class="cobr-kpi-label">Precisam de ação</div>
    </div>`;
}

function renderCobrTabs() {
  const el = document.getElementById('cobr-cat-tabs');
  el.innerHTML = COBR_CATS.map(c => {
    const n     = cobrCache[c.id].length;
    const ativo = c.id === cobrCatAtiva;

    return `

        <span class="plan-cat-count">${n}</span>
      </button>`;
  }).join('');
}

function renderCobrLista() {
  const el    = document.getElementById('list-cobrancas');
  const lista = cobrCache[cobrCatAtiva] || [];
  if (!lista.length) {
    el.innerHTML = `<div class="admin-empty"><i class="fa fa-circle-check"></i>Nenhuma loja nesta situação.</div>`;

}

  cobrCatAtiva = id;
  renderCobrTabs();

}

/* ══ MÉTRICAS ═════════════════════════════════════════════════ */
const PLAN_COLOR = { PRO: '#f59e0b', PLUS: '#6366f1', GRATIS: '#7a7a7a' };

async function loadMetricas() {
  const tableEl  = document.getElementById('metric-table');
  const periodEl = document.getElementById('metric-period');
  tableEl.innerHTML = '<div class="loading-row"><i class="fa fa-spinner fa-spin"></i> Carregando...</div>';

  try {
    const resp = await fetch(
      `${APPS_SCRIPT_URL}?action=metricas&token=${encodeURIComponent(_sessionToken || '')}`,
      { signal: AbortSignal.timeout(12000) }
    );
    const json = await resp.json();
    if (json.status === 'erro' && json.msg === 'UNAUTHORIZED') {
      handleUnauthorized(); return;
    }
    if (json.status !== 'ok' || !Array.isArray(json.data)) throw new Error('Resposta inválida');

    const data = json.data; // já vem ordenado por total desc

    // KPIs
    const totCliques = data.reduce((s, r) => s + r.total, 0);
    const totWpp     = data.reduce((s, r) => s + r.wpp,   0);
    const totTel     = data.reduce((s, r) => s + r.tel,   0);
    const totIg      = data.reduce((s, r) => s + (r.ig || 0), 0);
    const totViews   = data.reduce((s, r) => s + (r.views || 0), 0);
    const conv       = totViews > 0 ? Math.round((totCliques / totViews) * 100) : 0;
    document.getElementById('kpi-total').textContent = totCliques;
    document.getElementById('kpi-views').textContent = totViews;
    document.getElementById('kpi-conv').textContent  = totViews > 0 ? conv + '%' : '—';
    document.getElementById('kpi-wpp').textContent   = totWpp;
    document.getElementById('kpi-tel').textContent   = totTel;
    document.getElementById('kpi-ig').textContent    = totIg;

    periodEl.textContent = `${data.length} lojas com cliques registrados`;

    if (!data.length) {
      tableEl.innerHTML = '<div class="admin-empty"><i class="fa fa-chart-bar"></i>Nenhum clique registrado ainda.</div>';
      return;
    }

    const maxTotal = data[0].total || 1;
    const rankIcon = ['🥇','🥈','🥉'];
    const rankCls  = ['gold','silver','bronze'];

    tableEl.innerHTML = data.map((r, i) => {
      const pct    = w => Math.round((w / maxTotal) * 100);
      const cor    = PLAN_COLOR[r.plano] || '#7a7a7a';
      const rIcon  = rankIcon[i] ?? (i + 1);
      const rCls   = rankCls[i] ?? '';
      return `
        <div class="metric-row">
          <div class="metric-rank ${rCls}">${rIcon}</div>
          <div class="metric-info">
            <div class="metric-nome">${r.loja}</div>
            <div class="metric-plano" style="color:${cor};">${r.plano}</div>
            <div class="metric-stats">
              ${(r.views || 0) > 0 ? `<span class="metric-stat"><i class="fa fa-eye"></i> ${r.views}</span>` : ''}
              ${(r.menu  || 0) > 0 ? `<span class="metric-stat"><i class="fa fa-utensils"></i> ${r.menu}</span>` : ''}
              ${crescimentoBadge(r)}
            </div>
          </div>
          <div class="metric-bars">
            <div class="metric-bar-wrap">
              <span class="metric-bar-label" style="color:#25d366;">WPP</span>
              <div class="metric-bar-track">
                <div class="metric-bar-fill wpp" style="width:${pct(r.wpp)}%;"></div>
              </div>
            </div>
            <div class="metric-bar-wrap">
              <span class="metric-bar-label" style="color:var(--blue);">TEL</span>
              <div class="metric-bar-track">
                <div class="metric-bar-fill tel" style="width:${pct(r.tel)}%;"></div>
              </div>
            </div>
            ${(r.ig || 0) > 0 ? `
            <div class="metric-bar-wrap">
              <span class="metric-bar-label" style="color:#e1306c;">IG</span>
              <div class="metric-bar-track">
                <div class="metric-bar-fill ig" style="width:${pct(r.ig||0)}%;"></div>
              </div>
            </div>` : ''}
          </div>
          <div class="metric-total">${r.total}</div>
        </div>`;
    }).join('');

  } catch(e) {
    tableEl.innerHTML = '<div class="admin-empty"><i class="fa fa-triangle-exclamation"></i>Erro ao carregar métricas.</div>';
    periodEl.textContent = '';
  }
}

// Carrega métricas quando a aba é ativada — integrado ao switchTab original acima

/* ══ INIT ═════════════════════════════════════════════════════ */
if (_storedToken) loadData();
</script>

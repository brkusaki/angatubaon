<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Sem conexão · AngatubaON</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0d0d0d;
      --surface: #181818;
      --border:  rgba(255,255,255,0.08);
      --text:    #f0f0f0;
      --muted:   #7a7a7a;
      --red:     #ff4444;
      --green:   #00d084;
      --font-h:  'Syne', sans-serif;
      --font-b:  'DM Sans', sans-serif;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-b); font-size: 14px;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Animated signal icon */
    .offline-icon-wrap {
      position: relative;
      width: 80px; height: 80px;
      margin-bottom: 28px;
    }
    .offline-icon-wrap .icon-main {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      animation: float 3s ease-in-out infinite;
    }
    .offline-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(255,68,68,0.15);
      animation: ring-pulse 2.5s ease-out infinite;
    }
    .offline-ring:nth-child(2) { animation-delay: 0.8s; }
    .offline-ring:nth-child(3) { animation-delay: 1.6s; }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes ring-pulse {
      0%   { transform: scale(0.8); opacity: 0.6; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .offline-logo {
      font-family: var(--font-h); font-size: 1.4rem; font-weight: 800;
      letter-spacing: -0.03em; margin-bottom: 6px;
    }
    .offline-logo span { color: var(--red); }

    .offline-title {
      font-family: var(--font-h); font-size: 1.25rem; font-weight: 800;
      text-align: center; margin-bottom: 10px;
    }
    .offline-sub {
      font-size: 13px; color: var(--muted); text-align: center;
      line-height: 1.6; max-width: 280px; margin-bottom: 32px;
    }

    .offline-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px 20px;
      width: 100%; max-width: 320px;
      margin-bottom: 16px;
    }
    .offline-card-title {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: 10px;
    }
    .offline-tip {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 12px; color: var(--text); margin-bottom: 8px;
      line-height: 1.5;
    }
    .offline-tip:last-child { margin-bottom: 0; }
    .offline-tip-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

    .offline-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; max-width: 320px;
      padding: 14px 24px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, var(--red), #cc2222);
      color: #fff; font-family: var(--font-h);
      font-size: 14px; font-weight: 800; cursor: pointer;
      transition: opacity 0.2s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .offline-btn:active { transform: scale(0.96); opacity: 0.9; }

    .offline-footer {
      margin-top: 32px; font-size: 11px; color: var(--muted); text-align: center;
    }
    .offline-footer span { color: var(--red); }
  </style>
</head>
<body>

  <div class="offline-icon-wrap">
    <div class="offline-ring"></div>
    <div class="offline-ring"></div>
    <div class="offline-ring"></div>
    <div class="icon-main">📡</div>
  </div>

  <div class="offline-logo">Angatuba<span>ON</span></div>

  <div class="offline-title">Sem conexão</div>
  <div class="offline-sub">
    Parece que você está offline. Verifique sua internet e tente novamente.
  </div>

  <div class="offline-card">
    <div class="offline-card-title">O que fazer</div>
    <div class="offline-tip">
      <span class="offline-tip-icon">📶</span>
      <span>Verifique se o Wi‑Fi ou dados móveis estão ativados</span>
    </div>
    <div class="offline-tip">
      <span class="offline-tip-icon">✈️</span>
      <span>Certifique-se de que o modo avião está desligado</span>
    </div>
    <div class="offline-tip">
      <span class="offline-tip-icon">🔄</span>
      <span>Tente recarregar a página após reconectar</span>
    </div>
  </div>

  <button class="offline-btn" onclick="tentarNovamente()">
    <span id="btn-icon">🔄</span>
    <span id="btn-text">Tentar novamente</span>
  </button>

  <div class="offline-footer">
    <span>AngatubaON</span> · Angatuba, SP
  </div>

  <script>
    let tentando = false;
    function tentarNovamente() {
      if (tentando) return;
      tentando = true;
      const icon = document.getElementById('btn-icon');
      const txt  = document.getElementById('btn-text');
      icon.style.animation = 'ring-pulse 0.6s linear infinite';
      txt.textContent = 'Verificando...';

      // Tenta buscar a página principal
      fetch('/', { method: 'HEAD', cache: 'no-store' })
        .then(() => { window.location.href = '/'; })
        .catch(() => {
          txt.textContent = 'Ainda sem conexão';
          icon.textContent = '❌';
          setTimeout(() => {
            txt.textContent = 'Tentar novamente';
            icon.textContent = '🔄';
            icon.style.animation = '';
            tentando = false;
          }, 2500);
        });
    }

    // Detecta quando a conexão volta e recarrega automaticamente
    window.addEventListener('online', () => {
      document.getElementById('btn-text').textContent = 'Conexão restaurada!';
      document.getElementById('btn-icon').textContent = '✅';
      setTimeout(() => { window.location.href = '/'; }, 1200);
    });
  </script>
</body>
</html>
